name: DustDemo
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DustDemo:
    type: application
    platform: iOS
    sources: [DustDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SwiftUIDustDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 文字消散
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
  DustDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DustDemoTests]
    dependencies:
      - target: DustDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DustDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DustDemoUITests]
    dependencies:
      - target: DustDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DustDemo:
    build:
      targets:
        DustDemo: all
    test:
      targets: [DustDemoTests, DustDemoUITests]
